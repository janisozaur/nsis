name: Build, Test and Publish
on:
  push:
    branches-ignore:
      - trunk
      - svn2git-cache
  pull_request:

jobs:
  build-posix:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 parked: it runs exactly the same commands as macos-26
        # (host tools plus a mingw cross pass), but its jobs measured
        # 2m14s-15m01s over the recent runs against 2m02s-4m41s for
        # macos-26, and its runners queue far behind, which holds whole
        # runs in "queued". The long tail is also above the job cap, so
        # it would fail healthy builds. Restore when runner capacity
        # settles or when something macOS specific needs covering.
        os: [ubuntu-22.04, ubuntu-24.04, macos-26] # macos-15 parked
        log: [yes, no]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Brew Dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install scons mingw-w64 zlib
          curl --retry 9 -sLo cppunit.rb "https://sourceforge.net/p/nsis/code/HEAD/tree/web-scripts/trunk/cppunit.rb?format=raw"
          HOMEBREW_DEVELOPER=true brew install -s --formula cppunit.rb

      - name: Apt Dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            scons zlib1g-dev libcppunit-dev \
            g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Build x86 stubs and plugins, test, stage dist
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=x86 XGCC_W32_PREFIX=i686-w64-mingw32- \
            SKIPCLEAN_DIST=yes test dist-zip

      - name: Install x64 mingw-w64 zlib into the cross sysroot
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # zlib.net answers 200 with an HTML page where the tarball should be,
          # which curl -f accepts, so validate each attempt before trying the
          # next source instead of falling through to `tar xzf`.
          get_zlib() { curl -fL --retry 9 --retry-connrefused -o "$1" "$2" && tar tzf "$1" >/dev/null; }
          get_zlib zlib-src.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz" \
            || get_zlib zlib-src.tar.gz "https://zlib.net/fossils/zlib-1.3.2.tar.gz"
          rm -rf zlib-src-amd64 && mkdir zlib-src-amd64 && tar xzf zlib-src.tar.gz -C zlib-src-amd64 --strip-components=1
          cd zlib-src-amd64
          CC=x86_64-w64-mingw32-gcc ./configure --static --prefix=/usr/x86_64-w64-mingw32
          make -j"$(nproc)"
          sudo make install

      - name: Build amd64 stubs and plugins, merge into dist
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=amd64 XGCC_W32_PREFIX=x86_64-w64-mingw32- \
            SKIPCLEAN_DIST=yes dist-zip

      - name: Restage x86 tools and rebuild the zip
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=x86 XGCC_W32_PREFIX=i686-w64-mingw32- \
            SKIPCLEAN_DIST=yes dist-zip

      - name: Verify multi-arch staging
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          zip=$(ls -t nsis-*.zip | head -n1)
          unzip -l "$zip" | grep 'Stubs/lzma-x86-unicode'
          unzip -l "$zip" | grep 'Stubs/lzma-amd64-unicode'
          unzip -l "$zip" | grep 'Stubs/zlib-amd64-unicode'

      - name: Build and test (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          scons -j"$(sysctl -n hw.ncpu)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            APPEND_CPPPATH=/opt/homebrew/include APPEND_LIBPATH=/opt/homebrew/lib \
            test dist-zip

      - name: Config Errors
        if: failure()
        run: cat config.log

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        log: [yes, no]
    runs-on: ${{ matrix.os }}
    # 20 rather than 10: on runs 41414621044 and 41420542390 exactly one of the
    # four build-windows jobs was killed at the 10 minute mark inside "Build and
    # test x86 (MSVC)" while its siblings finished that same step in 3-4 minutes
    # with nothing in the log.  A job timeout makes the whole run read
    # "cancelled", which hides whether the build itself is green.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Choco Dependencies
        run: |
          curl --retry 9 -sLo cppunit-msvc-1.12.1.exe https://downloads.sourceforge.net/project/cppunit-msvc/cppunit-msvc-1.12.1.exe
          $arguments = "/S /D=$HOME\cppunit"
          Start-Process ./cppunit-msvc-1.12.1.exe $arguments -NoNewWindow -Wait
          pip install scons
          choco install zip
          # microsoft removed the download of htmlhelp.exe -- https://chocolatey.org/packages/html-help-workshop#comment-5245282888
          #choco install html-help-workshop
          echo "${Env:ProgramFiles(x86)}\HTML Help Workshop" >> $Env:GITHUB_PATH

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and test x86 (MSVC)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.3 TARGET_ARCH=x86 `
            ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} `
            APPEND_CPPPATH=$HOME/cppunit/include APPEND_LIBPATH=$HOME/cppunit/lib/release-win32 `
            test dist

      - name: Verify PE security flags
        shell: pwsh
        run: |
          pip install pefile
          python -c "import pefile,sys; pe=pefile.PE('build/urelease/makensis/makensis.exe'); ch=pe.FILE_HEADER.Characteristics; dc=pe.OPTIONAL_HEADER.DllCharacteristics; p=pefile.PE('build/urelease/AdvSplash/x86-unicode/AdvSplash.dll'); dc2=p.OPTIONAL_HEADER.DllCharacteristics; checks=[('makensis LARGE_ADDRESS_AWARE',ch&0x0020),('makensis NX_COMPAT',dc&0x0100),('makensis DYNAMIC_BASE',dc&0x0040),('makensis TERMINAL_SERVER_AWARE',dc&0x8000),('makensis does not claim NO_SEH',not (dc&0x0400)),('plugin NX_COMPAT',dc2&0x0100),('plugin keeps NO_SEH',dc2&0x0400)]; [print(('ok   ' if ok else 'FAIL ')+n) for n,ok in checks]; sys.exit(any(not ok for _,ok in checks))"

      - name: Nightly Build
        run: |
          rm nsis-*.zip
          scons "-j$Env:NUMBER_OF_PROCESSORS" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" DOCTYPES=web dist-zip
          echo https://github.com/$Env:GITHUB_REPOSITORY/actions/runs/$Env:GITHUB_RUN_ID > build.log
          ls -Name nsis-*.zip -OutVariable zip
          zip $zip build.log
        if: matrix.log == 'no' && matrix.os == 'windows-2022' && github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build.zip
          path: nsis-*.zip
        if: matrix.log == 'no' && matrix.os == 'windows-2022' && github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'

      - name: Setup x64 zlib import library (vcpkg)
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $dst = "$HOME/zlib-x64"
          New-Item -ItemType Directory -Force "$dst/lib" | Out-Null
          Copy-Item "$root/include" -Destination "$dst/include" -Recurse -Force
          # vcpkg's zlib port ships the runtime as z.dll plus a release (z.lib)
          # and a debug (zd.lib) import library.  An import library records the
          # DLL name it was built for, so picking the debug one links a
          # makensis.exe that demands zd.dll at run time and dies with
          # 0xC0000135.  Pick the release DLL first, then the import library
          # that was made for that exact name.
          $dll = Get-ChildItem "$root" -Recurse -Filter '*.dll' |
            Where-Object { $_.BaseName -like 'z*' -and $_.BaseName -notmatch 'd$' -and
                           $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem "$root" -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Error 'no zlib runtime DLL found under installed/x64-windows'
            exit 1
          }
          $imp = Get-ChildItem "$root" -Recurse -Filter "$($dll.BaseName).lib" |
            Where-Object { $_.BaseName -notmatch 'static' -and
                           $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $imp) {
            $imp = Get-ChildItem "$root" -Recurse -Filter '*.lib' |
              Where-Object { $_.BaseName -like 'z*' -and $_.BaseName -notmatch 'd$' -and
                             $_.FullName -notmatch '[\\/]debug[\\/]' } |
              Sort-Object FullName | Select-Object -First 1
          }
          if (-not $imp) {
            Get-ChildItem "$root" -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Error 'no zlib import library found under installed/x64-windows'
            exit 1
          }
          Copy-Item $imp.FullName -Destination "$dst/lib/zdll.lib"
          Copy-Item $dll.FullName -Destination "$dst/"
          Write-Output "import lib: $($imp.Name); runtime: $($dll.Name)"

      - name: Setup MSVC amd64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build amd64 stubs and plugins (MSVC amd64)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.3 TARGET_ARCH=amd64 `
            ZLIB_W32=$HOME/zlib-x64 SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} `
            stubs plugins

      - name: Verify amd64 MSVC outputs
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 'stub_lzma.exe' | Where-Object { $_.Directory.Name -eq 'stub_lzma-amd64-unicode' } | Select-Object -First 1
          if (-not $stub) { Write-Error 'no MSVC-built amd64 lzma stub found under build/'; exit 1 }
          $plugin = Get-ChildItem build -Recurse -File -Filter '*.dll' | Where-Object { $_.Directory.Name -eq 'amd64-unicode' } | Select-Object -First 1
          if (-not $plugin) { Write-Error 'no MSVC-built amd64 plugin DLL found under build/'; exit 1 }

      - name: Config Errors
        if: failure()
        run: cat config.log

  # First arm64 pass, informational: builds the arm64 target with MSVC on a
  # native Windows ARM64 runner.  Non-blocking (continue-on-error) because
  # arm64 is not part of the Phase 1 release surface; the purpose of this job
  # is to learn, in one run, how far the existing MSVC path gets on arm64.
  # Why the mingw route is not used here (measured, do not retry blindly):
  #   - Ubuntu has no aarch64 mingw-w64 toolchain in any suite: apt-cache finds
  #     no gcc/g++/binutils-mingw-w64-aarch64 on ubuntu-22.04, ubuntu-24.04,
  #     ubuntu-24.04-arm or ubuntu-26.04-arm, and packages.ubuntu.com has no
  #     such package for any suite/arch.  conda-forge has no
  #     mingw-w64-aarch64-* packages; Homebrew's mingw-w64 formula builds only
  #     i686 and x86_64 (target_archs).
  #   - llvm-mingw does ship aarch64-w64-mingw32-{gcc,g++,as,ar,ranlib,windres},
  #     but it links with lld: it rejects -Wl,--exclude-libs (used by
  #     SCons/Config/gnu) and silently ignores -B pei-aarch64-little and
  #     -T SCons/Config/linker_script, so the section order NSIS stubs depend
  #     on is not enforced.  The arm64 linker probe in SCons/Config/gnu
  #     correctly reports failure and falls back to the default layout.
  # Runner facts this job is written against (image windows-11-vs2026-arm64):
  #   arch=ARM64, VS 2026 with MSVC toolsets 14.29/14.44/14.51 and
  #   bin\Hostarm64\arm64\ml64.exe for 14.44/14.51, C:\vcpkg present, scons is
  #   not preinstalled.  SCons 4.11 maps VS major 18 to VC '14.5', hence
  #   MSVS_VERSION=14.5 below.
  arm64-msvc:
    runs-on: windows-11-arm
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build tools
        shell: pwsh
        run: pip install scons pefile

      - name: Toolchain inventory
        shell: pwsh
        run: |
          echo "arch=$env:PROCESSOR_ARCHITECTURE number_of_processors=$Env:NUMBER_OF_PROCESSORS"
          (python --version) 2>&1
          (scons --version) 2>&1 | Select-Object -First 3
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -prerelease -products * -property installationPath
            & $vswhere -latest -prerelease -products * -property installationVersion
          } else { Write-Warning 'no vswhere' }
          $msvc = 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin'
          echo "--- arm64 toolsets (cl/link/lib/rc/ml64):"
          foreach ($bin in (Get-ChildItem $msvc -Directory -ErrorAction SilentlyContinue)) {
            $t = $bin.Parent.Name
            foreach ($hostdir in @('Hostarm64\arm64', 'Hostx64\arm64')) {
              $tools = @('cl', 'link', 'lib', 'rc', 'ml64') |
                Where-Object { Test-Path (Join-Path $bin.FullName "$hostdir\$_.exe") }
              if ($tools) { Write-Output "$t $hostdir -> $($tools -join ' ')" }
            }
          }
          echo "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
        continue-on-error: true

      - name: Setup MSVC arm64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup arm64 zlib import library (vcpkg)
        shell: pwsh
        run: |
          vcpkg install zlib:arm64-windows
          if (-not $env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT = 'C:\vcpkg' }
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/arm64-windows"
          $dst = "$HOME/zlib-arm64"
          New-Item -ItemType Directory -Force "$dst/lib" | Out-Null
          Copy-Item "$root/include" -Destination "$dst/include" -Recurse -Force
          # same lookup as the x64 pass: release DLL first, then the import
          # library built for that exact name (see the x64 step for why)
          $dll = Get-ChildItem "$root" -Recurse -Filter '*.dll' |
            Where-Object { $_.BaseName -like 'z*' -and $_.BaseName -notmatch 'd$' -and
                           $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem "$root" -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Error 'no zlib runtime DLL found under installed/arm64-windows'
            exit 1
          }
          $imp = Get-ChildItem "$root" -Recurse -Filter "$($dll.BaseName).lib" |
            Where-Object { $_.BaseName -notmatch 'static' -and
                           $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $imp) {
            $imp = Get-ChildItem "$root" -Recurse -Filter '*.lib' |
              Where-Object { $_.BaseName -like 'z*' -and $_.BaseName -notmatch 'd$' -and
                             $_.FullName -notmatch '[\\/]debug[\\/]' } |
              Sort-Object FullName | Select-Object -First 1
          }
          if (-not $imp) {
            Get-ChildItem "$root" -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Error 'no zlib import library found under installed/arm64-windows'
            exit 1
          }
          Copy-Item $imp.FullName -Destination "$dst/lib/zdll.lib"
          Copy-Item $dll.FullName -Destination "$dst/"
          Write-Output "import lib: $($imp.Name); runtime: $($dll.Name)"

      - name: Build makensis (MSVC arm64)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.5 `
            TARGET_ARCH=arm64 ZLIB_W32=$HOME/zlib-arm64 SKIPUTILS="NSIS Menu" makensis

      # A 0xC0000135 exit only says "some DLL in the chain is missing", not
      # which binary was missing which DLL, so print the import lists and try
      # the three PATH combinations that could supply the missing one.
      - name: Probe makensis startup (informational)
        shell: pwsh
        run: |
          $mk = 'build\urelease\makensis\makensis.exe'
          echo "--- makensis import list:"
          dumpbin /dependents $mk 2>&1 | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -match '^[A-Za-z0-9_.+-]+\.dll$' }
          echo "--- zlib runtime and its imports, with System32 resolution:"
          $sys32 = Join-Path $env:SystemRoot 'System32'
          foreach ($d in (Get-ChildItem "$HOME/zlib-arm64" -Filter '*.dll')) {
            echo "  file: $($d.FullName)"
            $deps = dumpbin /dependents $d.FullName 2>&1 | ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[A-Za-z0-9_.+-]+\.dll$' }
            foreach ($dep in $deps) {
              $here = Test-Path (Join-Path $sys32 $dep)
              echo "    $dep in System32: $here"
            }
          }
          echo "--- VC runtime presence (z.dll imports VCRUNTIME140.dll):"
          foreach ($name in @('VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'ucrtbase.dll')) {
            $here = Test-Path (Join-Path $sys32 $name)
            echo "    $name in System32: $here"
          }
          echo "--- bare run (fails if the runtime it was linked against is not next to it):"
          & $mk /VERSION
          echo "exit=$LASTEXITCODE"
          echo "--- run with the zlib folder appended to PATH:"
          $env:PATH = "$env:PATH;$HOME\zlib-arm64"
          & $mk /VERSION
          echo "exit=$LASTEXITCODE"
        continue-on-error: true

      - name: Build arm64 stubs (MSVC arm64)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.5 `
            TARGET_ARCH=arm64 ZLIB_W32=$HOME/zlib-arm64 SKIPUTILS="NSIS Menu" stubs

      - name: Build arm64 plugins (MSVC arm64)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.5 `
            TARGET_ARCH=arm64 ZLIB_W32=$HOME/zlib-arm64 SKIPUTILS="NSIS Menu" plugins

      - name: Verify arm64 MSVC outputs
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 'stub_lzma.exe' |
            Where-Object { $_.Directory.Name -eq 'stub_lzma-arm64-unicode' } | Select-Object -First 1
          if (-not $stub) { Write-Error 'no MSVC-built arm64 lzma stub found under build/'; exit 1 }
          $plugin = Get-ChildItem build -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'arm64-unicode' } | Select-Object -First 1
          if (-not $plugin) { Write-Error 'no MSVC-built arm64 plugin DLL found under build/'; exit 1 }
          Set-Content -Path check-arm64.py -Encoding ascii -Value @(
            'import glob, pefile, sys',
            'paths = [r"build/urelease/makensis/makensis.exe"]',
            'paths += glob.glob("build/urelease/stub_*-arm64-unicode/stub_*.exe")[:2]',
            'paths += glob.glob("build/urelease/*/arm64-unicode/*.dll")[:3]',
            'bad = []',
            'for p in paths:',
            '    pe = pefile.PE(p)',
            '    names = [s.Name.rstrip(b"\x00").decode("ascii", "replace") for s in pe.sections]',
            '    print("%-70s machine=0x%04X %s" % (p, pe.FILE_HEADER.Machine, names))',
            '    if pe.FILE_HEADER.Machine != 0xAA64: bad.append("wrong machine: " + p)',
            '    if "stub" in p and ".ndata" not in names: bad.append("stub has no .ndata: " + p)',
            '    oh = pe.OPTIONAL_HEADER',
            '    # Stubs and plugins get their version fields from GetTargetMinOS',
            '    # Version (SConstruct), and that function has to stay at 6.02:',
            '    # an arm64 image asking for 6.4 is refused by the loader of a',
            '    # windows-11-arm runner with 0xC000007B before its entry point',
            '    # (run 41424942127).  makensis is printed but not checked: the',
            '    # version in it is whatever the linker chose, and the makensis',
            '    # startup probe judges that one by behaviour instead.',
            '    if "stub" in p or ".dll" in p:',
            '        for what, maj, mi in (("os", oh.MajorOperatingSystemVersion, oh.MinorOperatingSystemVersion),',
            '                              ("subsystem", oh.MajorSubsystemVersion, oh.MinorSubsystemVersion)):',
            '            if (maj, mi) != (6, 2): bad.append("%s version %d.%d in %s" % (what, maj, mi, p))',
            'if len(paths) < 4: bad.append("too few outputs inspected: %d" % len(paths))',
            'print("bad: %r" % bad)',
            'sys.exit(1 if bad else 0)'
          )
          python check-arm64.py

      - name: Smoke test an arm64 installer (informational)
        shell: pwsh
        run: |
          # No PATH help here on purpose: with the release import library the
          # staged Bin\makensis.exe asks for z.dll, which dist-zip stages right
          # next to it, and z.dll only needs VCRUNTIME140.dll which is present
          # in System32 on this image (probe step).  If this fails again the
          # staged layout itself is wrong, and that is what we want to see.
          # SKIPCLEAN_DIST keeps the staged nsis-* tree around: dist-zip deletes
          # ZIPDISTDIR in a post action otherwise, and this step then has nothing
          # to run and reports "smoke test skipped" (runs 41414621044 and
          # 41416163567).  There is a single TARGET_ARCH pass here, so keeping the
          # directory has no effect beyond that.
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.5 `
            TARGET_ARCH=arm64 ZLIB_W32=$HOME/zlib-arm64 SKIPUTILS="NSIS Menu" DOCTYPES=web `
            SKIPCLEAN_DIST=yes dist-zip
          $dist = Get-ChildItem -Directory -Filter 'nsis-*' | Select-Object -First 1
          if (-not $dist) {
            Write-Warning 'no staged dist dir (nsis-*), smoke test skipped'
            exit 0
          }
          # dist-zip stages the real makensis as Bin\makensis.exe and puts a
          # SubStart launcher at the root; the build_nsis_menu_for_zip action
          # that runs the launcher can fail without breaking the staging, so
          # keep going and drive makensis ourselves.
          $mk = Join-Path $dist.FullName 'Bin\makensis.exe'
          if (-not (Test-Path $mk)) { $mk = Join-Path $dist.FullName 'makensis.exe' }
          if (-not (Test-Path $mk)) {
            Write-Warning "no makensis.exe under $($dist.FullName), smoke test skipped"
            exit 0
          }
          $env:NSISDIR = $dist.FullName
          echo "makensis: $mk ; NSISDIR=$env:NSISDIR"
          Get-ChildItem (Join-Path $dist.FullName 'Bin') -Filter '*.dll' |
            ForEach-Object { echo "  Bin\$($_.Name)" }
          Set-Content -Path payload.txt -Encoding ascii -Value 'arm64 smoke payload'
          # SetOutPath is not optional here: File copies to the current output
          # path, which is not $INSTDIR unless the script says so, and without it
          # nothing ever appears where the check at the end of this step looks
          # (measured against the amd64 build of this same script).
          Set-Content -Path smoke.nsi -Encoding ascii -Value @(
            'Unicode true',
            'Name "arm64 smoke"',
            'OutFile "smoke-setup.exe"',
            'RequestExecutionLevel user',
            'InstallDir "$LOCALAPPDATA\arm64-smoke"',
            'Section',
            '  SetOutPath "$INSTDIR"',
            '  File "payload.txt"',
            'SectionEnd'
          )
          & $mk /V2 smoke.nsi
          Write-Output "makensis exit=$LASTEXITCODE"
          if (-not (Test-Path smoke-setup.exe)) {
            Write-Error 'makensis produced no installer (see the startup probe step for the import lists)'
            exit 1
          }
          # Side by side with the stubs it was made from: an image that the
          # loader refuses usually shows up here as a data directory or an
          # entry point that no longer falls inside a section.
          Set-Content -Path peinfo.py -Encoding ascii -Value @(
            'import os, sys, pefile',
            'for path in sys.argv[1:]:',
            '    pe = pefile.PE(path)',
            '    fh, oh = pe.FILE_HEADER, pe.OPTIONAL_HEADER',
            '    print(path, "file_size=%d" % os.path.getsize(path))',
            '    print("  machine=0x%X nsections=%d symtab=0x%X nsymbols=%d file_chars=0x%X" % (fh.Machine, fh.NumberOfSections, fh.PointerToSymbolTable, fh.NumberOfSymbols, fh.Characteristics))',
            '    print("  entry=0x%X size_of_headers=0x%X size_of_image=0x%X sec_align=0x%X file_align=0x%X image_base=0x%X" % (oh.AddressOfEntryPoint, oh.SizeOfHeaders, oh.SizeOfImage, oh.SectionAlignment, oh.FileAlignment, oh.ImageBase))',
            '    print("  linker=%d.%d os_version=%d.%d subsys_version=%d.%d subsys=%d dll_chars=0x%X" % (oh.MajorLinkerVersion, oh.MinorLinkerVersion, oh.MajorOperatingSystemVersion, oh.MinorOperatingSystemVersion, oh.MajorSubsystemVersion, oh.MinorSubsystemVersion, oh.Subsystem, oh.DllCharacteristics))',
            '    secs = []',
            '    for s in pe.sections:',
            '        name = s.Name.rstrip(b"\0").decode()',
            '        secs.append((s.VirtualAddress, s.VirtualAddress + max(s.Misc_VirtualSize, s.SizeOfRawData), name))',
            '        print("  sec %-8s va=0x%06X vsize=0x%06X raw=0x%06X rsize=0x%06X chars=0x%08X" % (name, s.VirtualAddress, s.Misc_VirtualSize, s.PointerToRawData, s.SizeOfRawData, s.Characteristics))',
            '    ep = [n for a, b, n in secs if a <= oh.AddressOfEntryPoint < b]',
            '    print("  entry section=%s" % (ep[0] if ep else "NONE"))',
            '    for i, d in enumerate(oh.DATA_DIRECTORY):',
            '        if d.VirtualAddress or d.Size:',
            '            w = [n for a, b, n in secs if a <= d.VirtualAddress < b]',
            '            print("  dir[%02d] rva=0x%06X size=0x%06X section=%s" % (i, d.VirtualAddress, d.Size, w[0] if w else "NONE"))'
          )
          $stubs = @(
            (Join-Path $dist.FullName 'Stubs\zlib-arm64-unicode'),
            (Join-Path $dist.FullName 'Stubs\lzma-arm64-unicode')
          )
          python peinfo.py $stubs[0] $stubs[1] .\smoke-setup.exe
          # Start-Process only says "%1 is not a valid Win32 application", and
          # one message covers several different Win32 errors, so go through
          # System.Diagnostics.Process and print the code.  Probe the staged
          # stubs too: if the loader refuses a stub that makensis never touched,
          # then the problem is in how the stub is linked, not in what makensis
          # does to it.
          function Start-AndReport([string]$exe, [string]$arguments) {
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo.FileName = (Resolve-Path $exe).Path
            $p.StartInfo.Arguments = $arguments
            $p.StartInfo.UseShellExecute = $false
            try {
              [void]$p.Start()
              if (-not $p.WaitForExit(20000)) {
                $p.Kill()
                Write-Output "  $exe : started, still running after 20 s (killed)"
              } else {
                Write-Output "  $exe : started, exit=$($p.ExitCode)"
              }
            } catch {
              $e = $_.Exception
              while ($e.InnerException) { $e = $e.InnerException }
              Write-Output "  $exe : start failed code=$($e.NativeErrorCode) $($e.Message)"
            }
          }
          foreach ($s in $stubs) {
            if (-not (Test-Path $s)) { continue }
            $tmp = "probe-$(Split-Path -Leaf $s).exe"
            Copy-Item $s $tmp -Force
            Start-AndReport $tmp '/S'
          }
          Start-AndReport .\smoke-setup.exe '/S'
          $installed = "$env:LOCALAPPDATA\arm64-smoke\payload.txt"
          if (Test-Path $installed) {
            Write-Output "SMOKE OK: arm64 stub installed $(Get-Content $installed)"
          } else {
            Write-Error "arm64 installer ran but did not install $installed"
            exit 1
          }
        continue-on-error: true

      # The loader refuses a bad image before its entry point runs, and each way
      # of starting one reports that differently: Start-Process only says "%1 is
      # not a valid Win32 application", System.Diagnostics.Process gives
      # 0xC000007B (STATUS_INVALID_IMAGE_FORMAT) and LoadLibrary gives Win32
      # error 193.  Run 41424942127 used byte-patched copies of the stub to work
      # out which field of the image was the problem (the subsystem version,
      # fixed in a1e209cf); what is worth keeping from that is the acceptance
      # test itself, so every arm64 image this build produces is now simply
      # asked whether this machine will take it.  A stub copied out of Stubs\
      # has no NSIS data behind it, so exiting or crashing is expected and means
      # the loader did its job; a plugin has to actually map into a process.
      - name: Check that the arm64 images load
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Directory -Filter 'nsis-*' | Select-Object -First 1
          if (-not $dist) { Write-Error 'no staged dist dir to inspect'; exit 1 }
          $bad = @()
          function Probe([string]$exe, [string]$a) {
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo.FileName = (Resolve-Path $exe).Path
            $p.StartInfo.Arguments = $a
            $p.StartInfo.UseShellExecute = $false
            try {
              [void]$p.Start()
              if (-not $p.WaitForExit(20000)) {
                $p.Kill()
                Write-Output "  $exe : loader accepted it (still running, killed)"
                return
              }
              $c = $p.ExitCode -band 0xFFFFFFFF
              if ($c -eq 0xC000007B) {
                $script:bad += "loader refused $exe (0xC000007B)"
                Write-Output "  $exe : loader refused it, 0xC000007B"
              } else {
                Write-Output ("  $exe : loader accepted it, exit=0x{0:X8}" -f $c)
              }
            } catch {
              $e = $_.Exception
              while ($e.InnerException) { $e = $e.InnerException }
              $script:bad += "could not start $exe (Win32 error $($e.NativeErrorCode))"
              Write-Output "  $exe : could not start, code=$($e.NativeErrorCode)"
            }
          }
          foreach ($s in Get-ChildItem (Join-Path $dist.FullName 'Stubs') -File -Filter '*-arm64-unicode') {
            $tmp = "load-probe-$($s.Name).exe"
            Copy-Item $s.FullName $tmp -Force
            Probe $tmp '/S'
            Remove-Item $tmp -Force
          }
          if (Test-Path .\smoke-setup.exe) { Probe '.\smoke-setup.exe' '/S' }
          # LOAD_WITH_ALTERED_SEARCH_PATH (0x1) so that a plugin finds anything
          # sitting next to it, which is how the stub loads it at run time.
          # Add-Type without -Namespace hides the class in a default namespace
          # and every later [Ldr] then dies with "Unable to find type" (run
          # 41428152508), so the namespace is spelled out on both sides.
          Add-Type -Name Ldr -Namespace NsisProbe -MemberDefinition '[System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr LoadLibraryExW(string file, IntPtr hFile, uint flags); [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError=true)] public static extern bool FreeLibrary(IntPtr module);'
          $mods = @(Get-ChildItem (Join-Path $dist.FullName 'Plugins\arm64-unicode') -File -Filter '*.dll' -ErrorAction SilentlyContinue)
          $mods += @(Get-ChildItem (Join-Path $dist.FullName 'Bin') -File -Filter 'RegTool-arm64.bin' -ErrorAction SilentlyContinue)
          if (-not $mods.Count) { $bad += 'no arm64 plugins in the dist to load' }
          foreach ($m in $mods) {
            try {
              $h = [NsisProbe.Ldr]::LoadLibraryExW($m.FullName, [IntPtr]::Zero, 0x1)
              if ($h -eq [IntPtr]::Zero) {
                $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                $bad += "LoadLibrary refused $($m.Name) (Win32 error $err)"
                Write-Output "  $($m.Name) : LoadLibrary refused it, Win32 error $err"
              } else {
                Write-Output "  $($m.Name) : mapped at 0x$($h.ToString('X'))"
                [void][NsisProbe.Ldr]::FreeLibrary($h)
              }
            } catch {
              $bad += "could not hand $($m.Name) to LoadLibraryExW ($($_.Exception.Message))"
              Write-Output "  $($m.Name) : $($_.Exception.Message)"
            }
          }
          if ($bad.Count) {
            Write-Output 'images the arm64 loader would not take:'
            $bad | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          Write-Output 'LOAD OK: every arm64 stub, plugin and the smoke installer was accepted'

      # Nothing in this job gates anything, and a failing arm64 image is
      # easier to look at somewhere with more tools than a runner: the zip is a
      # complete arm64 build (Bin\makensis.exe, Stubs, Plugins) and
      # smoke-setup.exe is the exact file the step above tried to start, with
      # the script and payload that produced it.
      - name: Upload arm64 build (informational)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nsis-arm64-msvc
          path: |
            nsis-*.zip
            smoke-setup.exe
            smoke.nsi
            payload.txt
            peinfo.py
          retention-days: 14
          if-no-files-found: warn

      - name: Config Errors
        if: failure()
        run: cat config.log

  vc6-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract Visual C++ 6.0 tools from giulioz/vc6-docker
        run: |
          docker pull giulioz/vc6-docker
          id=$(docker create giulioz/vc6-docker)
          mkdir -p vc6
          docker cp "$id:/opt/vc/BIN" vc6/BIN
          docker cp "$id:/opt/vc/INCLUDE" vc6/INCLUDE
          docker cp "$id:/opt/vc/LIB" vc6/LIB
          docker rm "$id"
          ls vc6/BIN | head

      - name: Upload VC6 toolchain
        uses: actions/upload-artifact@v7
        with:
          name: vc6-tools
          path: vc6/

  vc6:
    needs: [vc6-tools]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout VC6 Platform SDK
        uses: actions/checkout@v6
        with:
          repository: sjk7/VC6-Platform-SDK
          path: sdk

      - name: Download VC6 toolchain
        uses: actions/download-artifact@v8
        with:
          name: vc6-tools
          path: vc6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install scons
        run: pip install scons

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Build with VC6 (MSVS_VERSION=6.0 + VC6 Platform SDK)
        shell: pwsh
        run: |
          $Env:PATH = "$PWD\vc6\BIN;$Env:PATH"
          # the SDK repository nests everything in a second VC6PLATSDK directory
          $Env:INCLUDE = "$PWD\sdk\VC6PLATSDK\include;$PWD\vc6\INCLUDE"
          $Env:LIB = "$PWD\sdk\VC6PLATSDK\Lib;$PWD\vc6\LIB"
          foreach ($f in @("$PWD\vc6\BIN\cl.exe", "$PWD\sdk\VC6PLATSDK\include\windows.h",
                           "$PWD\vc6\INCLUDE\stdio.h", "$PWD\vc6\LIB\libc.lib")) {
            if (-not (Test-Path $f)) { Write-Error "missing toolchain file: $f"; exit 1 }
          }
          (Get-Command cl.exe).Source
          # makensis and dist-zip are deliberately out of scope here: makensis
          # compiles the bundled zstd (Source/zstd), whose headers need
          # `long long` and __declspec(deprecated), so it needs VS2005 or
          # newer. VC6 does have to keep building the release stubs, the
          # plugins and the Bin/ utilities, which is what this job checks.
          # The System plugin is the one exception: this toolset has no
          # ml.exe (MASM shipped separately from MSVC 6.0 Standard), and
          # Contrib/System/SConscript skips itself rather than linking a
          # plugin whose CallProc/CallBack/RealCallBack cannot resolve.
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=6.0 TARGET_ARCH=x86 `
            ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" utils stubs plugins
          if ($LASTEXITCODE -ne 0) {
            # scons -j can lose in cvtres: the VC6-era tool keeps its scratch
            # files in %TEMP% under the name lnk<N> with no locking, and two
            # rc/cvtres pairs started together (the UIs resources) pick the same
            # one, which shows up as
            #   CVTRES : fatal error CVT1108: cannot open ...\Temp\lnk3 for writing
            #   build\urelease\UIs\modern_nodesc-rc.res : fatal error LNK1123: failure during conversion to COFF: file invalid or corrupt
            #   scons: *** [build\urelease\UIs\modern_nodesc.exe] Error 1109
            # Only the resource compiles race, and everything already built is
            # up to date, so the serial retry costs a couple of minutes and only
            # in the rare case where the parallel attempt lost the race.
            Write-Output 'retrying serially (cvtres scratch file collision)'
            scons -j1 MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=6.0 TARGET_ARCH=x86 `
              ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" utils stubs plugins
          }

      - name: Verify VC6 outputs
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 'stub_*.exe' |
            Where-Object { $_.Directory.Name -like '*-x86-unicode' } | Select-Object -First 1
          if (-not $stub) { Write-Error 'no VC6-built stub found under build/'; exit 1 }
          $plugin = Get-ChildItem build -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'x86-unicode' } | Select-Object -First 1
          if (-not $plugin) { Write-Error 'no VC6-built plugin DLL found under build/'; exit 1 }
          $util = Get-ChildItem build -Recurse -File -Filter 'zip2exe.exe' | Select-Object -First 1
          if (-not $util) { Write-Error 'no VC6-built zip2exe.exe found under build/'; exit 1 }
          Write-Output "stub: $($stub.FullName)"; Write-Output "plugin: $($plugin.FullName)"; Write-Output "util: $($util.FullName)"

      - name: Config Errors
        if: failure()
        run: cat config.log

  nightly:
    if: github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build-windows]
    steps:
      - name: Download a single artifact
        uses: actions/download-artifact@v8
        with:
          name: build.zip
      - name: Upload to SourceForge
        run: |
          echo "$DEPLOY_KEY" > $HOME/deploy_key
          set -ex
          chmod 600 $HOME/deploy_key
          mkdir nightly
          unzip nsis-*.zip -d nightly
          LocalNightly=`ls -d nightly/nsis-*`
          RemoteNightly=kichik,nsis@web.sourceforge.net:/home/project-web/nsis/htdocs/nightly
          scp -oStrictHostKeyChecking=no -oBatchMode=yes -i $HOME/deploy_key nsis-*.zip $RemoteNightly/nsis.zip
          scp -oStrictHostKeyChecking=no -oBatchMode=yes -i $HOME/deploy_key nightly/build.log $RemoteNightly/build.log
          cp $LocalNightly/Docs/Contents.html $LocalNightly/Docs/index.html
          echo "Options +indexes" > $LocalNightly/Docs/.htaccess
          echo "Options +indexes" > $LocalNightly/Examples/.htaccess
          echo "Options +indexes" > $LocalNightly/Include/.htaccess
          echo "Options +indexes" > $LocalNightly/Contrib/.htaccess
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Docs/ $RemoteNightly/Docs/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Examples/ $RemoteNightly/Examples/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Include/ $RemoteNightly/Include/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Contrib/ $RemoteNightly/Contrib/
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
