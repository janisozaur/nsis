name: Build, Test and Publish
on:
  push:
    branches-ignore:
      - trunk
      - svn2git-cache
  pull_request:

jobs:
  build-posix:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 parked: it runs exactly the same commands as macos-26
        # (host tools plus a mingw cross pass), but its jobs measured
        # 2m14s-15m01s over the recent runs against 2m02s-4m41s for
        # macos-26, and its runners queue far behind, which holds whole
        # runs in "queued". The long tail is also above the job cap, so
        # it would fail healthy builds. Restore when runner capacity
        # settles or when something macOS specific needs covering.
        os: [ubuntu-22.04, ubuntu-24.04, macos-26] # macos-15 parked
        log: [yes, no]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Brew Dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install scons mingw-w64 zlib
          curl --retry 9 -sLo cppunit.rb "https://sourceforge.net/p/nsis/code/HEAD/tree/web-scripts/trunk/cppunit.rb?format=raw"
          HOMEBREW_DEVELOPER=true brew install -s --formula cppunit.rb

      - name: Apt Dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            scons zlib1g-dev libcppunit-dev \
            g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Build x86 stubs and plugins, test, stage dist
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=x86 XGCC_W32_PREFIX=i686-w64-mingw32- \
            SKIPCLEAN_DIST=yes test dist-zip

      - name: Install x64 mingw-w64 zlib into the cross sysroot
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # zlib.net answers 200 with an HTML page where the tarball should be,
          # which curl -f accepts, so validate each attempt before trying the
          # next source instead of falling through to `tar xzf`.
          get_zlib() { curl -fL --retry 9 --retry-connrefused -o "$1" "$2" && tar tzf "$1" >/dev/null; }
          get_zlib zlib-src.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz" \
            || get_zlib zlib-src.tar.gz "https://zlib.net/fossils/zlib-1.3.2.tar.gz"
          rm -rf zlib-src-amd64 && mkdir zlib-src-amd64 && tar xzf zlib-src.tar.gz -C zlib-src-amd64 --strip-components=1
          cd zlib-src-amd64
          CC=x86_64-w64-mingw32-gcc ./configure --static --prefix=/usr/x86_64-w64-mingw32
          make -j"$(nproc)"
          sudo make install

      - name: Build amd64 stubs and plugins, merge into dist
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=amd64 XGCC_W32_PREFIX=x86_64-w64-mingw32- \
            SKIPCLEAN_DIST=yes dist-zip

      - name: Restage x86 tools and rebuild the zip
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scons -j"$(nproc)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            TARGET_ARCH=x86 XGCC_W32_PREFIX=i686-w64-mingw32- \
            SKIPCLEAN_DIST=yes dist-zip

      - name: Verify multi-arch staging
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          zip=$(ls -t nsis-*.zip | head -n1)
          unzip -l "$zip" | grep 'Stubs/lzma-x86-unicode'
          unzip -l "$zip" | grep 'Stubs/lzma-amd64-unicode'
          unzip -l "$zip" | grep 'Stubs/zlib-amd64-unicode'

      - name: Build and test (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          scons -j"$(sysctl -n hw.ncpu)" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} \
            APPEND_CPPPATH=/opt/homebrew/include APPEND_LIBPATH=/opt/homebrew/lib \
            test dist-zip

      - name: Config Errors
        if: failure()
        run: cat config.log

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        log: [yes, no]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Choco Dependencies
        run: |
          curl --retry 9 -sLo cppunit-msvc-1.12.1.exe https://downloads.sourceforge.net/project/cppunit-msvc/cppunit-msvc-1.12.1.exe
          $arguments = "/S /D=$HOME\cppunit"
          Start-Process ./cppunit-msvc-1.12.1.exe $arguments -NoNewWindow -Wait
          pip install scons
          choco install zip
          # microsoft removed the download of htmlhelp.exe -- https://chocolatey.org/packages/html-help-workshop#comment-5245282888
          #choco install html-help-workshop
          echo "${Env:ProgramFiles(x86)}\HTML Help Workshop" >> $Env:GITHUB_PATH

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and test x86 (MSVC)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.3 TARGET_ARCH=x86 `
            ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} `
            APPEND_CPPPATH=$HOME/cppunit/include APPEND_LIBPATH=$HOME/cppunit/lib/release-win32 `
            test dist

      - name: Verify PE security flags
        shell: pwsh
        run: |
          pip install pefile
          python -c "import pefile,sys; pe=pefile.PE('build/urelease/makensis/makensis.exe'); ch=pe.FILE_HEADER.Characteristics; dc=pe.OPTIONAL_HEADER.DllCharacteristics; p=pefile.PE('build/urelease/AdvSplash/x86-unicode/AdvSplash.dll'); dc2=p.OPTIONAL_HEADER.DllCharacteristics; checks=[('makensis LARGE_ADDRESS_AWARE',ch&0x0020),('makensis NX_COMPAT',dc&0x0100),('makensis DYNAMIC_BASE',dc&0x0040),('makensis TERMINAL_SERVER_AWARE',dc&0x8000),('makensis does not claim NO_SEH',not (dc&0x0400)),('plugin NX_COMPAT',dc2&0x0100),('plugin keeps NO_SEH',dc2&0x0400)]; [print(('ok   ' if ok else 'FAIL ')+n) for n,ok in checks]; sys.exit(any(not ok for _,ok in checks))"

      - name: Nightly Build
        run: |
          rm nsis-*.zip
          scons "-j$Env:NUMBER_OF_PROCESSORS" ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" DOCTYPES=web dist-zip
          echo https://github.com/$Env:GITHUB_REPOSITORY/actions/runs/$Env:GITHUB_RUN_ID > build.log
          ls -Name nsis-*.zip -OutVariable zip
          zip $zip build.log
        if: matrix.log == 'no' && matrix.os == 'windows-2022' && github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build.zip
          path: nsis-*.zip
        if: matrix.log == 'no' && matrix.os == 'windows-2022' && github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'

      - name: Setup x64 zlib import library (vcpkg)
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $dst = "$HOME/zlib-x64"
          New-Item -ItemType Directory -Force "$dst/lib" | Out-Null
          Copy-Item "$root/include" -Destination "$dst/include" -Recurse -Force
          # vcpkg's zlib port names the import library after the DLL it came
          # from and that has moved around between releases, so look it up
          # instead of hard-coding installed/x64-windows/lib/zlib.lib
          $imp = Get-ChildItem "$root" -Recurse -Filter '*.lib' |
            Where-Object { $_.BaseName -like 'z*' } | Select-Object -First 1
          if (-not $imp) {
            Get-ChildItem "$root" -Recurse -File | Select-Object -ExpandProperty FullName
            Write-Error 'no zlib import library found under installed/x64-windows'
            exit 1
          }
          Copy-Item $imp.FullName -Destination "$dst/lib/zdll.lib"
          $dll = Get-ChildItem "$root" -Recurse -Filter '*.dll' |
            Where-Object { $_.BaseName -like 'z*' } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName -Destination "$dst/" }
          Write-Output "import lib: $($imp.Name); runtime: $($dll.Name)"

      - name: Setup MSVC amd64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build amd64 stubs and plugins (MSVC amd64)
        shell: pwsh
        run: |
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=14.3 TARGET_ARCH=amd64 `
            ZLIB_W32=$HOME/zlib-x64 SKIPUTILS="NSIS Menu" NSIS_CONFIG_LOG=${{ matrix.log }} `
            stubs plugins

      - name: Verify amd64 MSVC outputs
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 'stub_lzma.exe' | Where-Object { $_.Directory.Name -eq 'stub_lzma-amd64-unicode' } | Select-Object -First 1
          if (-not $stub) { Write-Error 'no MSVC-built amd64 lzma stub found under build/'; exit 1 }
          $plugin = Get-ChildItem build -Recurse -File -Filter '*.dll' | Where-Object { $_.Directory.Name -eq 'amd64-unicode' } | Select-Object -First 1
          if (-not $plugin) { Write-Error 'no MSVC-built amd64 plugin DLL found under build/'; exit 1 }

      - name: Config Errors
        if: failure()
        run: cat config.log

  vc6-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract Visual C++ 6.0 tools from giulioz/vc6-docker
        run: |
          docker pull giulioz/vc6-docker
          id=$(docker create giulioz/vc6-docker)
          mkdir -p vc6
          docker cp "$id:/opt/vc/BIN" vc6/BIN
          docker cp "$id:/opt/vc/INCLUDE" vc6/INCLUDE
          docker cp "$id:/opt/vc/LIB" vc6/LIB
          docker rm "$id"
          ls vc6/BIN | head

      - name: Upload VC6 toolchain
        uses: actions/upload-artifact@v7
        with:
          name: vc6-tools
          path: vc6/

  vc6:
    needs: [vc6-tools]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout VC6 Platform SDK
        uses: actions/checkout@v6
        with:
          repository: sjk7/VC6-Platform-SDK
          path: sdk

      - name: Download VC6 toolchain
        uses: actions/download-artifact@v8
        with:
          name: vc6-tools
          path: vc6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install scons
        run: pip install scons

      - name: Zlib Dependency
        run: |
          curl --retry 9 -sLo $HOME/zlib.zip "https://downloads.sourceforge.net/project/libpng/zlib/1.2.8/zlib128-dll.zip?r=&ts=1403402496&use_mirror=hivelocity"
          mkdir -p $HOME/zlib
          unzip -o $HOME/zlib.zip -d $HOME/zlib

      - name: Build with VC6 (MSVS_VERSION=6.0 + VC6 Platform SDK)
        shell: pwsh
        run: |
          $Env:PATH = "$PWD\vc6\BIN;$Env:PATH"
          # the SDK repository nests everything in a second VC6PLATSDK directory
          $Env:INCLUDE = "$PWD\sdk\VC6PLATSDK\include;$PWD\vc6\INCLUDE"
          $Env:LIB = "$PWD\sdk\VC6PLATSDK\Lib;$PWD\vc6\LIB"
          foreach ($f in @("$PWD\vc6\BIN\cl.exe", "$PWD\sdk\VC6PLATSDK\include\windows.h",
                           "$PWD\vc6\INCLUDE\stdio.h", "$PWD\vc6\LIB\libc.lib")) {
            if (-not (Test-Path $f)) { Write-Error "missing toolchain file: $f"; exit 1 }
          }
          (Get-Command cl.exe).Source
          # makensis and dist-zip are deliberately out of scope here: makensis
          # compiles the bundled zstd (Source/zstd), whose headers need
          # `long long` and __declspec(deprecated), so it needs VS2005 or
          # newer. VC6 does have to keep building the release stubs, the
          # plugins and the Bin/ utilities, which is what this job checks.
          # The System plugin is the one exception: this toolset has no
          # ml.exe (MASM shipped separately from MSVC 6.0 Standard), and
          # Contrib/System/SConscript skips itself rather than linking a
          # plugin whose CallProc/CallBack/RealCallBack cannot resolve.
          scons "-j$Env:NUMBER_OF_PROCESSORS" MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=6.0 TARGET_ARCH=x86 `
            ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" utils stubs plugins
          if ($LASTEXITCODE -ne 0) {
            # scons -j can lose in cvtres: the VC6-era tool keeps its scratch
            # files in %TEMP% under the name lnk<N> with no locking, and two
            # rc/cvtres pairs started together (the UIs resources) pick the same
            # one, which shows up as
            #   CVTRES : fatal error CVT1108: cannot open ...\Temp\lnk3 for writing
            #   build\urelease\UIs\modern_nodesc-rc.res : fatal error LNK1123: failure during conversion to COFF: file invalid or corrupt
            #   scons: *** [build\urelease\UIs\modern_nodesc.exe] Error 1109
            # Only the resource compiles race, and everything already built is
            # up to date, so the serial retry costs a couple of minutes and only
            # in the rare case where the parallel attempt lost the race.
            Write-Output 'retrying serially (cvtres scratch file collision)'
            scons -j1 MSTOOLKIT=yes MSVC_USE_SCRIPT=None MSVS_VERSION=6.0 TARGET_ARCH=x86 `
              ZLIB_W32=$HOME/zlib SKIPUTILS="NSIS Menu" utils stubs plugins
          }

      - name: Verify VC6 outputs
        shell: pwsh
        run: |
          $stub = Get-ChildItem build -Recurse -File -Filter 'stub_*.exe' |
            Where-Object { $_.Directory.Name -like '*-x86-unicode' } | Select-Object -First 1
          if (-not $stub) { Write-Error 'no VC6-built stub found under build/'; exit 1 }
          $plugin = Get-ChildItem build -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'x86-unicode' } | Select-Object -First 1
          if (-not $plugin) { Write-Error 'no VC6-built plugin DLL found under build/'; exit 1 }
          $util = Get-ChildItem build -Recurse -File -Filter 'zip2exe.exe' | Select-Object -First 1
          if (-not $util) { Write-Error 'no VC6-built zip2exe.exe found under build/'; exit 1 }
          Write-Output "stub: $($stub.FullName)"; Write-Output "plugin: $($plugin.FullName)"; Write-Output "util: $($util.FullName)"

      - name: Config Errors
        if: failure()
        run: cat config.log

  nightly:
    if: github.ref == 'refs/heads/master' && github.repository == 'nsis-dev/nsis'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build-windows]
    steps:
      - name: Download a single artifact
        uses: actions/download-artifact@v8
        with:
          name: build.zip
      - name: Upload to SourceForge
        run: |
          echo "$DEPLOY_KEY" > $HOME/deploy_key
          set -ex
          chmod 600 $HOME/deploy_key
          mkdir nightly
          unzip nsis-*.zip -d nightly
          LocalNightly=`ls -d nightly/nsis-*`
          RemoteNightly=kichik,nsis@web.sourceforge.net:/home/project-web/nsis/htdocs/nightly
          scp -oStrictHostKeyChecking=no -oBatchMode=yes -i $HOME/deploy_key nsis-*.zip $RemoteNightly/nsis.zip
          scp -oStrictHostKeyChecking=no -oBatchMode=yes -i $HOME/deploy_key nightly/build.log $RemoteNightly/build.log
          cp $LocalNightly/Docs/Contents.html $LocalNightly/Docs/index.html
          echo "Options +indexes" > $LocalNightly/Docs/.htaccess
          echo "Options +indexes" > $LocalNightly/Examples/.htaccess
          echo "Options +indexes" > $LocalNightly/Include/.htaccess
          echo "Options +indexes" > $LocalNightly/Contrib/.htaccess
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Docs/ $RemoteNightly/Docs/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Examples/ $RemoteNightly/Examples/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Include/ $RemoteNightly/Include/
          rsync -e "ssh -i $HOME/deploy_key -oStrictHostKeyChecking=no -oBatchMode=yes" -va --delete $LocalNightly/Contrib/ $RemoteNightly/Contrib/
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
